name: less
# Manifesto XcodeGen. Fonte de verdade do projeto Xcode (versionada em texto,
# editavel no Windows). O .xcodeproj e GERADO no Mac/CI com `xcodegen generate`
# e fica no .gitignore. Ver ROADMAP.md e MAC-HANDOFF.md.

options:
  bundleIdPrefix: cloud.convextech
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"                 # Swift 6 language mode (ADR-06)
    SWIFT_STRICT_CONCURRENCY: complete   # concorrencia estrita obrigatoria
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  less:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"       # gerado pelo XcodeGen a partir do bloco `info` abaixo
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: less
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes:
          - audio                        # reproducao em background (PRD 5.6, guardrail nenhum viola)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.convextech.less
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"      # iPhone apenas (PRD 1.4)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  lessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: less
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cloud.convextech.lessTests

schemes:
  less:
    build:
      targets:
        less: all
        lessTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - lessTests
