name: CI

# Compilador remoto do projeto: como o iOS nativo nao compila no Windows, o runner
# macOS do GitHub Actions gera o projeto, compila para o simulador e roda os testes
# Swift Testing SEM conta Apple (build de simulador nao exige assinatura).
# Repo publico = minutos macOS ilimitados; repo privado ~= 200 min reais/mes (multiplicador 10x).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator, sem assinatura)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode em uso
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Escolher um simulador iPhone disponivel
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json; d=json.load(sys.stdin); \
                devs=[x for r in d['devices'].values() for x in r if x.get('isAvailable') and 'iPhone' in x['name']]; \
                print(devs[-1]['udid'] if devs else '')")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulador: $UDID"

      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project less.xcodeproj \
            -scheme less \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
